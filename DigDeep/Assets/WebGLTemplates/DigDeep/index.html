<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DigDeep</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a131a; }
    body { display: grid; place-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { width: 100%; height: 100%; min-height: 0; position: relative; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; color: #efbd58; font: 16px sans-serif; text-align: center; background: #0a131a; }
    progress { margin-top: 16px; accent-color: #efbd58; }
  </style>
</head>
<body>
  <main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="디그딥 채굴 게임"></canvas><div id="loading">DIG DEEP<progress max="1" value="0"></progress><p id="message">불러오는 중…</p></div></main>
  <script>
    const canvas = document.querySelector('canvas');
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    const script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}', frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}', streamingAssetsUrl: 'StreamingAssets',
      companyName: 'DigDeep', productName: 'DigDeep', productVersion: '0.1',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, value => document.querySelector('progress').value = value)
      .then(() => document.querySelector('#loading').remove())
      .catch(() => document.querySelector('#message').textContent = '실행하지 못했습니다. 페이지를 새로고침해 주세요.');
    script.onerror = () => document.querySelector('#message').textContent = '게임 파일을 불러오지 못했습니다.';
    document.body.appendChild(script);
  </script>
</body>
</html>
